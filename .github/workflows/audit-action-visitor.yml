name: Action research visitor audit
on:
  push:
    branches: [main]
    paths:
      - "research-action.html"
      - "styles-20261013.css"
      - "site-theme.css"
      - "appearance.css"
      - "appearance.js"
      - "scripts/audit-action-visitor.py"
      - ".github/workflows/audit-action-visitor.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: action-research-visitor-main
  cancel-in-progress: false
jobs:
  visitor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and PDF inspector
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7
          python -m playwright install --with-deps chromium
      - name: Check classroom action research page
        run: |
          set +e
          python -m http.server 8779 --bind 127.0.0.1 >/tmp/action-http.log 2>&1 &
          python scripts/audit-action-visitor.py 2>&1 | tee action-visitor-audit.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
        id: audit
      - name: Store exact source and visual evidence
        if: always()
        run: |
          mkdir -p action-visitor-output/source
          cp research-action.html styles-20261013.css site-theme.css appearance.css appearance.js action-visitor-output/source/
          cp action-visitor-audit.log action-visitor-output/ 2>/dev/null || true
      - name: Publish compact audit findings for verification
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("action-visitor-output/report.json")
          report=json.loads(p.read_text()) if p.exists() else {}
          screens=report.get("screens",[])
          pdf=report.get("print",{})
          summary={
            "workflow_run_id":os.getenv("GITHUB_RUN_ID"),
            "head_sha":os.getenv("GITHUB_SHA"),
            "audit_exit_code":os.getenv("AUDIT_EXIT_CODE","missing"),
            "screen_widths_tested":[s.get("width") for s in screens],
            "widths_with_errors":[{"width":s.get("width"),"errors":s.get("errors")} for s in screens if s.get("errors")],
            "footer_gaps":[{"width":s.get("width"),"pixels":s.get("footerGap")} for s in screens],
            "table_geometry":[{"width":s.get("width"),"tables":s.get("tables")} for s in screens if s.get("width") in (320,375,768,1024,1440)],
            "keyboard_navigation":next((s.get("keyboard") for s in screens if s.get("width")==375),None),
            "dark_contrast":next((s.get("darkContrast") for s in screens if s.get("width")==375),None),
            "print":pdf,
            "log_tail":Path("action-visitor-audit.log").read_text()[-2500:] if Path("action-visitor-audit.log").exists() else "audit did not produce a log"
          }
          Path("docs/ACTION_VISITOR_LATEST_RESULTS.json").write_text(json.dumps(summary,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/ACTION_VISITOR_LATEST_RESULTS.json /tmp/action-visitor-result.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          incoming=json.loads(Path("/tmp/action-visitor-result.json").read_text())
          p=Path("docs/ACTION_VISITOR_LATEST_RESULTS.json")
          if p.exists():
              existing=json.loads(p.read_text())
              if int(existing.get("workflow_run_id") or 0)>int(incoming.get("workflow_run_id") or 0):
                  Path("/tmp/action-visitor-newer-exists").touch()
          PY
            if [ -f /tmp/action-visitor-newer-exists ]; then
              echo "A more recent visitor audit already published; preserving it."
              break
            fi
            cp /tmp/action-visitor-result.json docs/ACTION_VISITOR_LATEST_RESULTS.json
            git add docs/ACTION_VISITOR_LATEST_RESULTS.json
            if git diff --cached --quiet; then
              echo "Visitor audit result already current."
              break
            fi
            git commit -m "Record latest action research visitor audit results [skip ci]"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Could not publish after four conflict-safe attempts."
              exit 1
            fi
          done
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-research-visitor-evidence
          path: action-visitor-output/
          retention-days: 14
