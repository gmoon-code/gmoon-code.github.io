name: Story Method detail-page visitor audit

on:
  push:
    branches: [main]
    paths:
      - "story-method.html"
      - "site-previews.js"
      - "styles-20261013.css"
      - "site-theme.css"
      - "appearance.css"
      - "appearance.js"
      - "assets/story-method-observation-window.webp"
      - "scripts/audit-story-detail.py"
      - ".github/workflows/audit-story-detail.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  visitor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out current website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and PDF parser
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7
          python -m playwright install --with-deps chromium
      - name: Run Story Method visitor tests
        run: |
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/story-http.log 2>&1 &
          python scripts/audit-story-detail.py
      - name: Archive exact page source
        if: always()
        run: |
          mkdir -p story-detail-audit-output/source
          cp story-method.html site-previews.js styles-20261013.css \
             site-theme.css appearance.css appearance.js \
             story-detail-audit-output/source/
      - name: Upload rendered audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-detail-visitor-evidence
          path: story-detail-audit-output/
          retention-days: 7
      - name: Publish check result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RESULT: ${{ job.status }}
        run: |
          if [ "$AUDIT_RESULT" = "success" ]; then result=success; else result=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$result" \
            -f context="audit/story-detail" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Story Method responsive, keyboard and A4: $AUDIT_RESULT"
