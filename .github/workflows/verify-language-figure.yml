name: Verify licensed figure extraction

on:
  push:
    paths:
      - .github/workflows/verify-language-figure.yml
      - scripts/retrieve-published-figure.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF figure inspection tools
        run: pip install PyMuPDF==1.26.4
      - name: Locate source figure and render for visual review
        run: python scripts/retrieve-published-figure.py
      - name: Save extraction evidence
        uses: actions/upload-artifact@v4
        with:
          name: published-figure-source-page
          path: docs/visual-audit/gonzalez-figure-source-page.png
          if-no-files-found: warn
      - name: Commit result report and any valid preview
        run: |
          git add docs/visual-audit/figure-retrieval-status.json
          if [ -f docs/visual-audit/gonzalez-figure-source-page.png ]; then
            git add docs/visual-audit/gonzalez-figure-source-page.png
          fi
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Report licensed scholarly figure retrieval"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
