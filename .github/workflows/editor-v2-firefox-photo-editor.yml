name: Editor V2 Firefox photo description regression

on:
  push:
    branches: [main]
    paths:
      - 'editor-v2.js'
      - 'editor-v2.html'
      - 'tests/editor-v2-current-website.spec.cjs'
      - '.github/workflows/editor-v2-firefox-photo-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-image-inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check editor-v2.js
          node --check tests/editor-v2-current-website.spec.cjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Firefox browser
        run: npx playwright install --with-deps firefox
      - name: Start website source server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/editor-v2-photo-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sSf http://127.0.0.1:8765/editor-v2.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify actual page photo description editing and mocked publication
        run: npx playwright test tests/editor-v2-current-website.spec.cjs --browser firefox --workers=1 --grep "Real-page photo description change publishes exact verified preview" --reporter=list
        env:
          CI: 'true'
      - name: Preserve failed test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-photo-editor-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
