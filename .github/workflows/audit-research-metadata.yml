name: Academic research citation and preprint metadata audit
on:
  push:
    branches: [main]
    paths:
      - "research.html"
      - "research-scoping.html"
      - "research-action.html"
      - "writing-biological-classification.html"
      - "teaching*.html"
      - "cv.html"
      - "scripts/audit-research-metadata.py"
      - ".github/workflows/audit-research-metadata.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scholarly-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.14.2
      - name: Compare current scholarly references and DataCite preprint metadata
        id: metadata
        run: |
          set +e
          python scripts/audit-research-metadata.py 2>&1 | tee research-metadata-audit.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Preserve review summary in repository
        if: always() && github.ref == 'refs/heads/main'
        env:
          CODE: ${{ steps.metadata.outputs.exit_code }}
        run: |
          mkdir -p docs
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("research-metadata-audit-output/summary.json")
          src=json.loads(p.read_text()) if p.exists() else {"error":"No summary produced"}
          info={
            "workflow_run_id":os.getenv("GITHUB_RUN_ID"),"head_sha":os.getenv("GITHUB_SHA"),
            "exit_code":os.getenv("CODE"),"preprint":src.get("preprint"),
            "preprint_references":src.get("preprintReferences"),
            "preprint_review":src.get("preprintReview"),
            "unique_dois":src.get("doiUnique"),"citation_occurrences":src.get("citationOccurrences"),
            "counts":src.get("counts"),"manual_review":src.get("manualReview"),
            "unverified":src.get("unverified"),"status_inventory":src.get("statusInventory"),
            "qualifications":src.get("qualifications")
          }
          if not p.exists():
            info["log_tail"]=Path("research-metadata-audit.log").read_text()[-4000:]
          Path("docs/RESEARCH_METADATA_LATEST_RESULTS.json").write_text(json.dumps(info,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RESEARCH_METADATA_LATEST_RESULTS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record current preprint and cited research metadata [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academic-metadata-evidence
          path: |
            research-metadata-audit-output/
            research-metadata-audit.log
          retention-days: 14
