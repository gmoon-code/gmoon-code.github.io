name: Classification essay visitor audit
on:
  push:
    branches: [main]
    paths:
      - "writing-biological-classification.html"
      - "styles-20261013.css"
      - "site-theme.css"
      - "appearance.css"
      - "appearance.js"
      - "scripts/audit-classification-visitor.py"
      - ".github/workflows/audit-classification-visitor.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  visitor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and PDF/image inspector
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7
          python -m playwright install --with-deps chromium
      - name: Run exact essay visitor audit
        run: |
          python -m http.server 8778 --bind 127.0.0.1 >/tmp/classification-http.log 2>&1 &
          python scripts/audit-classification-visitor.py
      - name: Archive exact page styles
        if: always()
        run: |
          mkdir -p classification-audit-output/source
          cp writing-biological-classification.html styles-20261013.css site-theme.css appearance.css appearance.js classification-audit-output/source/
      - name: Upload browser screenshots and printed PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classification-visitor-evidence
          path: classification-audit-output/
          retention-days: 7
      - name: Status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="audit/classification-visitor" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Classification essay visitor and A4 audit: $RESULT"
