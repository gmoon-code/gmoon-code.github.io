name: Academic editor canvas checks
on:
  push:
    branches: [main]
    paths:
      - 'editor.js'
      - 'editor.html'
      - 'editor.css'
      - 'moon-free-responsive.js'
      - 'tests/academic-editor-canvas.spec.cjs'
      - '.github/workflows/academic-editor-canvas.yml'
  pull_request:
    paths:
      - 'editor.js'
      - 'editor.html'
      - 'editor.css'
      - 'moon-free-responsive.js'
      - 'tests/academic-editor-canvas.spec.cjs'
      - '.github/workflows/academic-editor-canvas.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canvas-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start local website server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/academic-editor-http.log 2>&1 &
      - name: Run real academic editor regression tests
        id: canvas_tests
        continue-on-error: true
        run: npx playwright test tests/academic-editor-canvas.spec.cjs --browser chromium --reporter=list --workers=1
      - name: Report browser result as a commit status
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.canvas_tests.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          if [ "$TEST_OUTCOME" = "success" ]; then RESULT=success; else RESULT=failure; fi
          jq -n --arg state "$RESULT" \
            --arg context "academic-editor-canvas/chromium" \
            --arg description "Real academic editor Chromium regression tests" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/canvas-status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/canvas-status.json \
            "$API_URL/repos/$REPOSITORY/statuses/$COMMIT_SHA"
      - name: Fail workflow if browser tests failed
        if: ${{ !cancelled() && steps.canvas_tests.outcome != 'success' }}
        run: exit 1
      - name: Save failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academic-editor-canvas-failure
          path: |
            test-results/**/error-context.md
            test-results/**/test-failed-*.png
            /tmp/academic-editor-http.log
          if-no-files-found: ignore
          retention-days: 7
