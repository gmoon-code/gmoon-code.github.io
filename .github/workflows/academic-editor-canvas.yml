name: Academic editor canvas checks
on:
  push:
    branches: [main]
    paths:
      - 'editor.js'
      - 'editor.html'
      - 'editor.css'
      - 'moon-free-responsive.js'
      - 'tests/academic-editor-canvas.spec.cjs'
      - '.github/workflows/academic-editor-canvas.yml'
  pull_request:
    paths:
      - 'editor.js'
      - 'editor.html'
      - 'editor.css'
      - 'moon-free-responsive.js'
      - 'tests/academic-editor-canvas.spec.cjs'
      - '.github/workflows/academic-editor-canvas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canvas-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start local website server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/academic-editor-http.log 2>&1 &
      - name: Run real academic editor regression tests
        run: npx playwright test tests/academic-editor-canvas.spec.cjs --browser chromium --reporter=list --workers=1
      - name: Save failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academic-editor-canvas-failure
          path: |
            test-results/**/error-context.md
            test-results/**/test-failed-*.png
            /tmp/academic-editor-http.log
          if-no-files-found: ignore
          retention-days: 7
