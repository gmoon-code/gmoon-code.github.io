name: Audit research figures

on:
  push:
    paths:
      - .github/workflows/audit-research-figures.yml
      - scripts/audit-research-figures.mjs
      - research.html
      - styles-20261013.css
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-research-figures
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 sharp@0.34.4
          npx playwright install --with-deps chromium
      - name: Capture original published Research figure at three viewports
        run: node scripts/audit-research-figures.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: research-figure-audit
          path: |
            docs/visual-audit/research-*.webp
            docs/visual-audit/research-figures-report.json
          if-no-files-found: error
      - name: Publish visual audit evidence
        run: |
          rm -f docs/visual-audit/research-inquiry-*.webp docs/visual-audit/research-evidence-*.webp
          git add -A docs/visual-audit/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Verify research figures in live browser"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
