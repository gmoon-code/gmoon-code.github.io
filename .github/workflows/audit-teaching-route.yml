name: Teaching overview visitor audit
on:
  push:
    branches: [main]
    paths:
      - "teaching.html"
      - "styles-20261013.css"
      - "site-theme.css"
      - "appearance.css"
      - "appearance.js"
      - "scripts/audit-teaching-route.py"
      - ".github/workflows/audit-teaching-route.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  visitor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Capture visitor-facing Teaching checks
        run: |
          python -m http.server 8767 --bind 127.0.0.1 >/tmp/teaching-http.log 2>&1 &
          python scripts/audit-teaching-route.py
      - name: Archive exact source
        if: always()
        run: |
          mkdir -p teaching-audit-output/source
          cp teaching.html styles-20261013.css site-theme.css appearance.css appearance.js teaching-audit-output/source/
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teaching-visitor-evidence
          path: teaching-audit-output/
          retention-days: 7
      - name: Set audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="audit/teaching-visitor" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Teaching overview Chromium audit: $RESULT"
