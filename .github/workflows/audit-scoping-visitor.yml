name: Scoping review visitor audit
on:
  push:
    branches: [main]
    paths:
      - "research-scoping.html"
      - "styles-20261013.css"
      - "site-theme.css"
      - "appearance.css"
      - "appearance.js"
      - "scripts/audit-scoping-visitor.py"
      - ".github/workflows/audit-scoping-visitor.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  visitor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and PDF inspector
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7
          python -m playwright install --with-deps chromium
      - name: Audit scoping review public page
        run: |
          python -m http.server 8779 --bind 127.0.0.1 >/tmp/scoping-http.log 2>&1 &
          python scripts/audit-scoping-visitor.py
      - name: Preserve exact HTML and site CSS
        if: always()
        run: |
          mkdir -p scoping-visitor-output/source
          cp research-scoping.html styles-20261013.css site-theme.css appearance.css appearance.js scoping-visitor-output/source/
      - name: Upload screenshot and A4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoping-visitor-evidence
          path: scoping-visitor-output/
          retention-days: 7
      - name: Report GitHub source audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="audit/scoping-visitor" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Scoping page, table and A4 browser audit: $RESULT"
