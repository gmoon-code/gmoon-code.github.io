name: S6 text enlargement and spacing resilience
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "styles-20261013.css"
      - "appearance.css"
      - "site-theme.css"
      - "scripts/audit-public-typography.py"
      - ".github/workflows/audit-public-typography.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6-public-typography-main
  cancel-in-progress: false
jobs:
  text-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and Firefox
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox
      - name: Check increased text spacing and font sizes
        id: check
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/s6-http.log 2>&1 &
          set +e
          python scripts/audit-public-typography.py 2>&1 | tee s6-typography-audit.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Publish compact exact-source report
        if: always() && github.ref == 'refs/heads/main'
        env:
          CODE: ${{ steps.check.outputs.exit_code }}
        run: |
          mkdir -p docs
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("s6-typography-output/summary.json")
          s=json.loads(p.read_text()) if p.exists() else {"error":"Missing results"}
          s.update(workflow_run_id=os.getenv("GITHUB_RUN_ID"),head_sha=os.getenv("GITHUB_SHA"),exit_code=os.getenv("CODE"))
          Path("/tmp/s6-result.json").write_text(json.dumps(s,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/s6-result.json docs/PUBLIC_TYPOGRAPHY_LATEST_RESULTS.json
            git add docs/PUBLIC_TYPOGRAPHY_LATEST_RESULTS.json
            if git diff --cached --quiet; then break; fi
            git commit -m "Record S6 public typography diagnostics [skip ci]"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
          done
      - name: Upload complete per-case evidence and sample screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s6-public-text-resilience-evidence
          path: |
            s6-typography-output/
            s6-typography-audit.log
          retention-days: 14
