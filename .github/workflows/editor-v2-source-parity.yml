name: Editor V2 source-parity and live-object checks
on:
  push:
    branches: [main]
    paths:
      - 'editor-v2.html'
      - 'editor-v2.css'
      - 'editor-v2.js'
      - 'tests/editor-v2-source-parity.spec.cjs'
      - 'tests/editor-v2-live-insertions.spec.cjs'
      - '.github/workflows/editor-v2-source-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-v2-live-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check editor syntax
        run: node --check editor-v2.js
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the website locally
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/editor-v2-http.log 2>&1 &
      - name: Test real-page insertions and GitHub output parity
        run: |
          npx playwright test \
            tests/editor-v2-live-insertions.spec.cjs \
            tests/editor-v2-source-parity.spec.cjs \
            --browser chromium --workers=1 --reporter=list
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-v2-parity-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
