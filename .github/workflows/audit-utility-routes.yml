name: Utility routes production visitor audit
on:
  push:
    branches: [main]
    paths:
      - "404.html"
      - "about.html"
      - "scripts/audit-utility-routes.py"
      - ".github/workflows/audit-utility-routes.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-utility-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and PDF checker
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7
          python -m playwright install --with-deps chromium
      - name: Test live Pages paths
        id: audit
        run: |
          set +e
          python scripts/audit-utility-routes.py 2>&1 | tee utility-route-audit.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Preserve diagnostic evidence
        if: always()
        run: |
          mkdir -p utility-route-audit/source
          cp 404.html about.html utility-route-audit/source/
          cp utility-route-audit.log utility-route-audit/ 2>/dev/null || true
      - name: Commit condensed result
        if: always() && github.ref == 'refs/heads/main'
        env:
          CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          mkdir -p docs
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("utility-route-audit/report.json")
          r=json.loads(p.read_text()) if p.exists() else {"errors":["report missing"]}
          d={
            "workflow_run_id":os.getenv("GITHUB_RUN_ID"),"head_sha":os.getenv("GITHUB_SHA"),"exit_code":os.getenv("CODE"),
            "production_route":r.get("route"),"errors":r.get("errors"),
            "screens":[{"width":s.get("width"),"http_status":s.get("status"),"footer_gap":s.get("gap"),
              "document_width":s.get("docWidth"),"errors":s.get("errors"),"dark_contrast":s.get("darkContrast")} for s in r.get("screens",[])],
            "keyboard":r.get("keyboard"),"about":r.get("about"),"print":r.get("print"),
            "log_tail":Path("utility-route-audit.log").read_text()[-3000:] if Path("utility-route-audit.log").exists() else "no log"
          }
          Path("docs/UTILITY_ROUTES_LATEST_RESULTS.json").write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UTILITY_ROUTES_LATEST_RESULTS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record production utility-route visitor results [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utility-routes-visitor-evidence
          path: utility-route-audit/
          retention-days: 14
