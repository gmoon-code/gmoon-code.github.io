name: Research hub visitor audit
on:
  push:
    branches: [main]
    paths:
      - "research.html"
      - "research-layout.css"
      - "styles-20261013.css"
      - "site-theme.css"
      - "appearance.css"
      - "appearance.js"
      - "assets/gonzalez-howard-2023-figure-1.webp"
      - "scripts/audit-research-hub-visitor.py"
      - ".github/workflows/audit-research-hub-visitor.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  visitor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and PDF inspector
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7
          python -m playwright install --with-deps chromium
      - name: Inspect visitor Research page
        run: |
          python -m http.server 8777 --bind 127.0.0.1 >/tmp/research-hub-http.log 2>&1 &
          python scripts/audit-research-hub-visitor.py
      - name: Preserve exact source snapshot
        if: always()
        run: |
          mkdir -p research-hub-audit-output/source
          cp research.html research-layout.css styles-20261013.css site-theme.css appearance.css appearance.js research-hub-audit-output/source/
      - name: Upload screenshots and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-hub-visitor-evidence
          path: research-hub-audit-output/
          retention-days: 7
      - name: Commit audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="audit/research-hub-visitor" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Research Chromium + A4 visitor audit: $RESULT"
