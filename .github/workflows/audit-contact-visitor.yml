name: Contact visitor audit
on:
  push:
    branches: [main]
    paths:
      - "contact.html"
      - "styles-20261013.css"
      - "site-theme.css"
      - "appearance.css"
      - "appearance.js"
      - "responsive-personal-media.css"
      - "responsive-personal-media.js"
      - "scripts/audit-contact-visitor.py"
      - ".github/workflows/audit-contact-visitor.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  visitor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and PDF inspection dependencies
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7 pillow
          python -m playwright install --with-deps chromium
      - name: Inspect exact visitor-facing Contact route
        run: |
          python -m http.server 8774 --bind 127.0.0.1 >/tmp/contact-http.log 2>&1 &
          python scripts/audit-contact-visitor.py
      - name: Preserve exact page source
        if: always()
        run: |
          mkdir -p contact-audit-output/source
          cp contact.html styles-20261013.css site-theme.css appearance.css appearance.js responsive-personal-media.css responsive-personal-media.js contact-audit-output/source/
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-visitor-evidence
          path: contact-audit-output/
          retention-days: 7
      - name: Audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="audit/contact-visitor" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Contact Chromium and A4 visitor audit: $RESULT"
