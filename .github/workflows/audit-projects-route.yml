name: Projects overview and preview visitor audit

on:
  push:
    branches: [main]
    paths:
      - "projects.html"
      - "story-method.html"
      - "research-methods-studio.html"
      - "site-previews.js"
      - "styles-20261013.css"
      - "site-theme.css"
      - "appearance.css"
      - "appearance.js"
      - "assets/story-method-interface.webp"
      - "assets/research-methods-studio-interface.webp"
      - "scripts/audit-projects-route.py"
      - ".github/workflows/audit-projects-route.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  visitor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7
          python -m playwright install --with-deps chromium
      - name: Capture Projects five-width and interaction tests
        run: |
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/projects-http.log 2>&1 &
          python scripts/audit-projects-route.py
      - name: Preserve exact public source snapshot
        if: always()
        run: |
          mkdir -p projects-audit-output/source
          cp projects.html story-method.html research-methods-studio.html site-previews.js \
             styles-20261013.css site-theme.css appearance.css appearance.js \
             projects-audit-output/source/
      - name: Publish Projects evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projects-visitor-evidence
          path: projects-audit-output/
          retention-days: 7
      - name: Publish Projects audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RESULT: ${{ job.status }}
        run: |
          if [ "$AUDIT_RESULT" = "success" ]; then result=success; else result=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$result" \
            -f context="audit/projects-visitor" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Projects five-width and preview controls: $AUDIT_RESULT"
