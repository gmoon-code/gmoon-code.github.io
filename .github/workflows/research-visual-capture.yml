name: Research five-width visual capture

on:
  push:
    branches: [main]
    paths:
      - "research.html"
      - "research-layout.css"
      - "scripts/research_visual_capture.py"
      - ".github/workflows/research-visual-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Capture Research layouts
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/research-http.log 2>&1 &
          python scripts/research_visual_capture.py
      - name: Publish screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-five-width-screenshots
          path: research-visual-output/
          retention-days: 7
