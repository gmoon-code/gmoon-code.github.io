name: Action research page visual capture

on:
  push:
    branches: [main]
    paths:
      - "research-action.html"
      - "styles-20261013.css"
      - "appearance.css"
      - "appearance.js"
      - "site-theme.css"
      - "scripts/longform_visual_capture.py"
      - ".github/workflows/action-research-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Capture action-research page at five widths
        env:
          VISUAL_PAGE: research-action.html
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/visual-http.log 2>&1 &
          python scripts/longform_visual_capture.py
      - name: Publish full-page images and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-research-visual-screenshots
          path: longform-visual-output/
          retention-days: 7
