name: Connection Studio offline and private-progress browser audit
on:
  push:
    branches: [main]
    paths:
      - "connection-studio/**"
      - "tests/connection-studio-offline.spec.cjs"
      - ".github/workflows/connection-studio-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-private-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test tools
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start same-origin static application
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/connection-studio-browser.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8765/connection-studio/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/connection-studio-browser.log
          exit 1
      - name: Test offline reload, cached assets, drafts and local progress
        run: npx playwright test tests/connection-studio-offline.spec.cjs --browser chromium --workers=1 --reporter=list
        env:
          CI: "true"
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connection-studio-offline-failures
          path: |
            test-results/
            /tmp/connection-studio-browser.log
          if-no-files-found: ignore
