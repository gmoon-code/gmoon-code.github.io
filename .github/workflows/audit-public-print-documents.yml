name: Public CV and Osmosis student worksheet print verification
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-public-print-documents.py"
      - ".github/workflows/audit-public-print-documents.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-print:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and PDF reader
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install --with-deps chromium
      - name: Render live public CV and printable worksheet to real A4 PDFs
        run: python scripts/audit-public-print-documents.py
      - name: Preserve generated PDFs and page-content diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-A4-CV-and-worksheet-print-evidence
          path: public-print-reader-output/
          retention-days: 21
