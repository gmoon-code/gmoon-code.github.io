name: Osmosis worksheet visitor audit
on:
  push:
    branches: [main]
    paths:
      - "teaching-osmosis-practice.html"
      - "styles-20261013.css"
      - "site-theme.css"
      - "appearance.css"
      - "appearance.js"
      - "scripts/audit-teaching-osmosis-practice.py"
      - ".github/workflows/audit-teaching-osmosis-practice.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  visitor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and PDF checker
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7
          python -m playwright install --with-deps chromium
      - name: Audit published osmosis worksheet
        run: |
          python -m http.server 8771 --bind 127.0.0.1 >/tmp/osmosis-http.log 2>&1 &
          python scripts/audit-teaching-osmosis-practice.py
      - name: Archive current source
        if: always()
        run: |
          mkdir -p osmosis-audit-output/source
          cp teaching-osmosis-practice.html styles-20261013.css site-theme.css appearance.css appearance.js osmosis-audit-output/source/
      - name: Upload browser and A4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osmosis-worksheet-visitor-evidence
          path: osmosis-audit-output/
          retention-days: 7
      - name: Set audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="audit/teaching-osmosis" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Osmosis worksheet Chromium and A4 audit: $RESULT"
