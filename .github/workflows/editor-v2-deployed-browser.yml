name: Editor V2 deployed HTTPS browser smoke

on:
  push:
    branches: [main]
    paths:
      - 'editor-v2.html'
      - 'editor-v2.js'
      - 'editor-v2.css'
      - 'tests/editor-v2-deployed-smoke.spec.cjs'
      - '.github/workflows/editor-v2-deployed-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-editing:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate test syntax
        run: node --check tests/editor-v2-deployed-smoke.spec.cjs
      - name: Install test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Edit public HTTPS-delivered Editor V2 without publishing
        run: npx playwright test tests/editor-v2-deployed-smoke.spec.cjs --browser ${{ matrix.browser }} --workers=1 --reporter=list
        env:
          CI: 'true'
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-v2-deployed-smoke-failure-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
