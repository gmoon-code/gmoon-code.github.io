name: Responsive browser check

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "styles-20261013.css"
      - "site-theme.css"
      - "scripts/responsive_smoke.py"
      - ".github/workflows/responsive-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser testing dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run responsive browser checks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/responsive-http.log 2>&1 &
          python scripts/responsive_smoke.py
      - name: Save screenshots and diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-screenshots
          path: visual-audit-output/
          retention-days: 7
