name: S7 public accessibility semantics and interaction states
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "appearance.js"
      - "appearance.css"
      - "site-previews.js"
      - "scripts/audit-public-interactions.py"
      - ".github/workflows/audit-public-interactions.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s7-public-interactions-main
  cancel-in-progress: false
jobs:
  semantic-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install accessibility test dependencies
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund axe-core@4.14.0
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test public semantics and interactive states
        id: check
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/s7-http.log 2>&1 &
          set +e
          python scripts/audit-public-interactions.py 2>&1 | tee s7-accessibility.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Publish latest exact-source summary
        if: always() && github.ref == 'refs/heads/main'
        env:
          CODE: ${{ steps.check.outputs.exit_code }}
        run: |
          mkdir -p docs
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("s7-accessible-interaction-output/summary.json")
          s=json.loads(p.read_text()) if p.exists() else {"error":"missing S7 result"}
          s.update(workflow_run_id=os.getenv("GITHUB_RUN_ID"),head_sha=os.getenv("GITHUB_SHA"),exit_code=os.getenv("CODE"))
          Path("/tmp/s7-interaction-result.json").write_text(json.dumps(s,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          incoming=json.loads(Path("/tmp/s7-interaction-result.json").read_text())
          p=Path("docs/PUBLIC_INTERACTIONS_LATEST_RESULTS.json")
          if p.exists():
              existing=json.loads(p.read_text())
              if int(existing.get("workflow_run_id") or 0)>int(incoming["workflow_run_id"]):
                  Path("/tmp/s7-newer-exists").touch()
          PY
            if [ -f /tmp/s7-newer-exists ]; then break; fi
            cp /tmp/s7-interaction-result.json docs/PUBLIC_INTERACTIONS_LATEST_RESULTS.json
            git add docs/PUBLIC_INTERACTIONS_LATEST_RESULTS.json
            if git diff --cached --quiet; then break; fi
            git commit -m "Record S7 accessible interactions [skip ci]"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
          done
      - name: Retain complete per-page and per-state diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s7-public-interaction-evidence
          path: |
            s7-accessible-interaction-output/
            s7-accessibility.log
          retention-days: 14
