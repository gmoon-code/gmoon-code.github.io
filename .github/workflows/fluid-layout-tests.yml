name: Fluid layout lab browser tests
on:
  pull_request:
    paths:
      - 'fluid-layout-lab.html'
      - 'editor.html'
      - 'tests/fluid-layout.spec.cjs'
      - '.github/workflows/fluid-layout-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start local preview server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/fluid-layout-http.log 2>&1 &
      - name: Run browser tests
        run: npx playwright test tests/fluid-layout.spec.cjs --browser chromium --reporter=list --workers=1
