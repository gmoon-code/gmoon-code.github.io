name: CV visitor audit
on:
  push:
    branches: [main]
    paths:
      - "cv.html"
      - "styles-20261013.css"
      - "site-theme.css"
      - "appearance.css"
      - "appearance.js"
      - "scripts/audit-cv-visitor.py"
      - ".github/workflows/audit-cv-visitor.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  visitor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and PDF checker
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7
          python -m playwright install --with-deps chromium
      - name: Audit current CV at exact desktop/phone breakpoints
        run: |
          python -m http.server 8776 --bind 127.0.0.1 >/tmp/cv-http.log 2>&1 &
          python scripts/audit-cv-visitor.py
      - name: Preserve exact source
        if: always()
        run: |
          mkdir -p cv-audit-output/source
          cp cv.html styles-20261013.css site-theme.css appearance.css appearance.js cv-audit-output/source/
      - name: Upload visitor and printed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-visitor-evidence
          path: cv-audit-output/
          retention-days: 7
      - name: Set audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="audit/cv-visitor" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="CV reader-facing Chromium and A4 audit: $RESULT"
