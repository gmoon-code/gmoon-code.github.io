name: Focused Home and nested 404 browser audit

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 404.html
      - moon-free-responsive.js
      - scripts/audit-home-route.py
      - .github/workflows/audit-home-route.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test page geometry and nested 404 in Chromium
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/home-route-http.log 2>&1 &
          python scripts/audit-home-route.py
      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-route-responsive-evidence
          path: home-route-audit-output/
          if-no-files-found: warn
          retention-days: 7
