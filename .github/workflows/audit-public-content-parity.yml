name: Published academic main-text parity

on:
  push:
    branches: [main]
    paths:
      - "research-scoping.html"
      - "research-action.html"
      - "teaching.html"
      - "scripts/audit-public-content-parity.py"
      - ".github/workflows/audit-public-content-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-content-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare served academic main text with source
        run: python scripts/audit-public-content-parity.py
      - name: Preserve actual remote-content check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-academic-content-parity
          path: site-parity-output/report.json
          retention-days: 14
