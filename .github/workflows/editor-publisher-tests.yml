name: Secure editor publisher checks

on:
  pull_request:
    paths:
      - "publisher/**"
      - "tests/publisher-worker.test.mjs"
      - "editor.js"
      - "editor.html"
      - "editor-publisher-config.js"
      - ".github/workflows/editor-publisher-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run OAuth, security, and PR-creation tests with mocked GitHub responses
        run: node --test tests/publisher-worker.test.mjs
